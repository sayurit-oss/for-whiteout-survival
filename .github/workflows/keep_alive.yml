name: Keep Streamlit Apps Alive via Commit

on:
  schedule:
    # 6時間ごとに実行（12時間以内ならいつでもOKですが安全のため）
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  dummy_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Make dummy changes & Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # タイムスタンプをファイルに書き込んで履歴を作る
          date > keep_alive_trigger.txt
          
          git add keep_alive_trigger.txt
          git commit -m "chore: keep alive trigger [skip ci]" || exit 0
          git push
